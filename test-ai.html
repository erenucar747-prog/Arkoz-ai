<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arkoz AI Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0a0a0a; color: #f0f0f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px; }
    h1 { color: #B8A88A; margin-bottom: 20px; }
    #chat-box { width: 100%; max-width: 600px; background: #111; border: 1px solid #333; border-radius: 12px; overflow: hidden; }
    #messages { height: 400px; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
    .msg { max-width: 80%; padding: 10px 14px; border-radius: 12px; font-size: 0.9rem; line-height: 1.5; }
    .msg.user { background: #B8A88A; color: #0a0a0a; align-self: flex-end; }
    .msg.ai { background: #1e1e1e; color: #f0f0f0; align-self: flex-start; }
    .msg.typing { color: #888; font-style: italic; }
    #input-area { display: flex; border-top: 1px solid #333; padding: 12px; gap: 8px; }
    #user-input { flex: 1; background: #1e1e1e; border: 1px solid #444; border-radius: 8px; color: #f0f0f0; padding: 10px 14px; font-size: 0.9rem; outline: none; }
    #send-btn { background: #B8A88A; color: #0a0a0a; border: none; border-radius: 8px; padding: 10px 18px; font-weight: 600; cursor: pointer; }
    #send-btn:disabled { opacity: 0.5; }
    #status { margin-top: 12px; font-size: 0.8rem; text-align: center; }
    #status.error { color: #ff6b6b; }
    #status.ok { color: #6bff8e; }
  </style>
</head>
<body>
  <h1>Arkoz AI Test</h1>
  <div id="chat-box">
    <div id="messages">
      <div class="msg ai">Merhaba! Ben Arkoz Gazbeton'un asistanıyım. Size nasıl yardımcı olabilirim?</div>
    </div>
    <div id="input-area">
      <input id="user-input" type="text" maxlength="1000" placeholder="Mesajınızı yazın..." />
      <button id="send-btn">Gönder</button>
    </div>
  </div>
  <div id="status"></div>
  <script>
    const WORKER_URL = 'https://arkoz-ai.vercel.app/api/chat';
    const MAX_HISTORY = 18; // sunucu cap'i (20) altında kal; yeni user+assistant çiftine yer bırak
    const messagesEl = document.getElementById('messages');
    const input = document.getElementById('user-input');
    const btn = document.getElementById('send-btn');
    const statusEl = document.getElementById('status');
    let history = [];
    let busy = false;

    function addMsg(text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + (role === 'user' ? 'user' : 'ai');
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
      return div;
    }

    async function send() {
      if (busy) return; // uçuştaki istek varken yeniden gönderme
      const text = input.value.trim();
      if (!text) return;
      if (text.length > 1000) {
        statusEl.textContent = 'Mesaj çok uzun (en fazla 1000 karakter).';
        statusEl.className = 'error';
        return;
      }
      busy = true;
      btn.disabled = true;
      input.value = '';
      statusEl.textContent = '';
      statusEl.className = '';
      addMsg(text, 'user');
      const typing = addMsg('Yazıyor...', 'ai');
      typing.classList.add('typing');
      // Kullanıcı mesajını geçmişe HENÜZ ekleme — istek başarısız olursa geçmiş zehirlenmesin.
      const outgoing = [...history, { role: 'user', content: text }].slice(-MAX_HISTORY);
      try {
        const res = await fetch(WORKER_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: outgoing }),
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          typing.remove();
          const msg = typeof data.error === 'string'
            ? data.error
            : (data.error && data.error.message) || 'Bir hata oluştu.';
          statusEl.textContent = 'Hata: ' + msg;
          statusEl.className = 'error';
        } else {
          const block = (data.content || []).find((b) => b && b.type === 'text' && b.text);
          const reply = block ? block.text : 'Üzgünüm, yanıt alınamadı, lütfen tekrar deneyin.';
          typing.textContent = reply;
          typing.classList.remove('typing');
          // SADECE başarıda geçmişe yaz (başarısızlık geçmişi bozmaz).
          history = [...history, { role: 'user', content: text }, { role: 'assistant', content: reply }].slice(-MAX_HISTORY);
          statusEl.textContent = 'Bağlantı başarılı';
          statusEl.className = 'ok';
        }
      } catch (err) {
        typing.remove();
        statusEl.textContent = 'Bağlantı hatası: ' + err.message;
        statusEl.className = 'error';
      }
      busy = false;
      btn.disabled = false;
    }
    btn.addEventListener('click', send);
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter') send(); });
  </script>
</body>
</html>
